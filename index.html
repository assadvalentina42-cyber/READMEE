<style>
@font-face{font-family:'SF Pro';font-weight:400;font-style:normal;font-display:swap;
  src:local('SF Pro Text'),local('SF Pro Display'),local('SFProText-Regular'),url('fonts/SF-Pro-Regular.woff2') format('woff2')}

:root{font-family:'SF Pro',Arial,sans-serif;color:#fff;background:#090807;font-synthesis:none}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090807}
html,body,button,a,.portal{cursor:none!important}

.experience{position:relative;width:100%;height:100%;min-height:540px;overflow:hidden;background:#0a0908}
.backgrounds,.background,.shade,.transition-layer,.transition-layer video{position:absolute;inset:0;width:100%;height:100%}
.background{object-fit:cover;opacity:0;transition:opacity .8s ease}
.background.is-visible{opacity:1}
.shade{z-index:1;background:linear-gradient(to bottom,transparent 52%,rgba(0,0,0,.88) 100%);pointer-events:none}
.chrome{position:absolute;z-index:4;transition:opacity .45s ease,filter .45s ease}
.experience.is-transitioning .chrome{opacity:0;filter:blur(8px);pointer-events:none}

/* Header */
.header{left:clamp(18px,1.95vw,28px);right:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);
  display:flex;justify-content:space-between;align-items:center}
.header-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
.nav{display:flex;align-items:center;height:42px;padding:4px 5px;border:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.1);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:999px}
.nav a{color:#fff;text-decoration:none;padding:8px 19px;border-radius:999px;line-height:1;font-size:16px}
.nav a.active{background:#fff;color:#000}
.menu{height:42px;padding:0 20px;border:0;border-radius:999px;background:#fff;color:#000;cursor:pointer;font:inherit;font-size:16px}

/* Sidebar */
.planet-list{left:clamp(18px,1.95vw,28px);top:50%;transform:translateY(-43%);display:flex;flex-direction:column;gap:6px;font-size:16px}
.planet-item{display:flex;align-items:center;min-height:20px}
.planet-item.active{font-size:18px;font-weight:700;gap:8px}
.planet-item.active:before{content:'';width:16px;height:16px;border-radius:50%;background:#fff}

/* Portal */
.portal-wrap{left:50%;top:50%;width:min(320px,31vw);transform:translate(-50%,-54%);perspective:none}
.portal-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:16px;opacity:0}
.portal-heading strong{font-size:18px;margin-left:8px}
.portal{position:relative;display:block;width:100%;aspect-ratio:320/350;padding:0;overflow:visible;border:0;
  border-radius:90px;background:transparent;cursor:pointer;box-shadow:none;transform:none!important;color:inherit}
.portal:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:6px}
.portal video,.portal img{visibility:hidden;position:absolute;width:1px;height:1px;pointer-events:none}
.portal-canvas{position:fixed;inset:0;z-index:3;width:100%;height:100%;pointer-events:none}

/* Content */
.planet-content{left:clamp(28px,4vw,58px);right:clamp(28px,3vw,44px);bottom:clamp(24px,3vh,30px);
  display:flex;justify-content:space-between;align-items:flex-end;gap:40px;pointer-events:none}
.planet-content h1{font-family:Aalto,'Arial Narrow',sans-serif;font-size:clamp(128px,21.8vw,314px);
  font-weight:400;line-height:.72;margin:0 0 -.04em;letter-spacing:0;transform:translateX(-32px);opacity:0}
.planet-content dl{flex:none;width:min(447px,34vw);margin:0;font-size:16px}
.fact{display:grid;grid-template-columns:138px 1fr;gap:18px;padding:8px 0;
  border-bottom:1px solid rgba(255,255,255,.48);opacity:0}
.fact:last-child{border-bottom:0}
.fact dt{font-weight:700}
.fact dd{margin:0}

/* Misc */
.transition-layer{display:none}
.scene-canvas{display:none}
.loading{position:absolute;z-index:12;left:50%;bottom:30px;transform:translateX(-50%);opacity:0;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s;pointer-events:none}
.experience.is-loading .loading{opacity:.8}
.experience.is-transitioning .header,.experience.is-transitioning .planet-list{opacity:1;filter:none;pointer-events:auto}
.experience.is-transitioning .shade{opacity:1}
.experience.is-committing .background{transition:none!important}

/* Preloader */
.preloader{position:absolute;inset:0;z-index:20;background:#000;overflow:hidden}
.preloader video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.preloader-shade{position:absolute;inset:auto 0 0;height:35%;background:linear-gradient(to bottom,transparent,#000)}
.preloader.is-background{z-index:0}
.preloader.is-background .preloader-shade{opacity:0}
.floating-logo{position:fixed;z-index:22;left:50%;top:50%;width:59px;height:58px;transform:translate(-50%,-50%);
  will-change:left,top,width,height,transform;
  transition:left 2s cubic-bezier(.16,1,.3,1),top 2s cubic-bezier(.16,1,.3,1),width 2s cubic-bezier(.16,1,.3,1),
    height 2s cubic-bezier(.16,1,.3,1),transform 2s cubic-bezier(.16,1,.3,1)}
.floating-logo.is-docked{left:clamp(18px,1.95vw,28px);top:clamp(18px,3.1vh,28px);width:37px;height:36px;transform:none}
.floating-logo.is-settled{z-index:5}
.preloader-count{position:fixed;z-index:22;left:50%;bottom:clamp(22px,3.1vh,28px);display:flex;align-items:flex-end;
  gap:4px;transform:translateX(-50%);font-family:'SF Pro',Arial,sans-serif;line-height:1}
.preloader-count>span:first-child{font-family:'SF Pro Thin','SF Pro',Arial,sans-serif;font-size:64px;font-weight:100;
  font-variant-numeric:tabular-nums}
.preloader-count .percent{font-size:24px;padding-bottom:4px}
.preloader-count.is-leaving{animation:preload-count-out .75s cubic-bezier(.22,1,.36,1) both}
@keyframes preload-count-out{to{opacity:0;filter:blur(7px);transform:translate(-50%,-34px)}}
body:not(.preload-complete) .custom-cursor{opacity:0!important}

/* Cursor */
.custom-cursor{display:block;position:fixed;left:0;top:0;z-index:100;width:1px;height:1px;
  pointer-events:none;opacity:0;transition:opacity .2s ease}
.custom-cursor.is-visible{opacity:1}
.cursor-dot,.cursor-orbit{position:absolute;left:0;top:0;border-radius:50%;transform:translate(-50%,-50%)}
.cursor-dot{width:12px;height:12px;background:#fff}
.cursor-orbit{width:36px;height:36px;border:1px solid #fff;background:rgba(255,255,255,.4);
  transition:transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-orbit{transform:translate(-50%,-50%) scale(1.16)}
.cursor-label{position:absolute;top:26px;left:0;transform:translateX(-50%) translateY(-4px);
  font:16px/1.2 'SF Pro',Arial,sans-serif;white-space:nowrap;opacity:0;
  transition:opacity .2s ease,transform .3s cubic-bezier(.22,1,.36,1)}
.custom-cursor.is-enter .cursor-label{opacity:1;transform:translateX(-50%) translateY(0)}
@media (hover:none){.custom-cursor{display:none}}

/* Entrance / switch animations */
body:not(.intro-ready) .header,body:not(.intro-ready) .planet-list,.planet-content h1,.planet-content .fact{opacity:0}
.intro-ready .header{animation:reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both}
.intro-ready .planet-list{animation:reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both}
.content-revealing .planet-content h1{animation:title-rise 1.05s cubic-bezier(.16,1,.3,1) both}
.content-revealing .planet-content .fact{animation:fact-rise .72s cubic-bezier(.22,1,.36,1) both}
.content-revealing .fact:nth-child(1){animation-delay:.52s}
.content-revealing .fact:nth-child(2){animation-delay:.68s}
.content-revealing .fact:nth-child(3){animation-delay:.84s}
.content-revealing .fact:nth-child(4){animation-delay:1s}
.mask-revealing .portal-heading{animation:portal-caption .85s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item{animation:menu-row .58s cubic-bezier(.22,1,.36,1) both}
.planet-list.is-switching .planet-item:nth-child(1){animation-delay:.02s}
.planet-list.is-switching .planet-item:nth-child(2){animation-delay:.05s}
.planet-list.is-switching .planet-item:nth-child(3){animation-delay:.08s}
.planet-list.is-switching .planet-item:nth-child(4){animation-delay:.11s}
.planet-list.is-switching .planet-item:nth-child(5){animation-delay:.14s}
.planet-list.is-switching .planet-item:nth-child(6){animation-delay:.17s}
.planet-list.is-switching .planet-item:nth-child(7){animation-delay:.2s}
.planet-list.is-switching .planet-item:nth-child(8){animation-delay:.23s}
.planet-list.is-switching .planet-item.active:before{animation:active-dot .55s cubic-bezier(.22,1,.36,1) .18s both}

@keyframes reveal-down{from{opacity:0;filter:blur(8px);transform:translateY(-18px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes reveal-side{from{opacity:0;filter:blur(8px);transform:translate(-20px,-43%)}to{opacity:1;filter:blur(0);transform:translate(0,-43%)}}
@keyframes title-rise{from{opacity:0;filter:blur(10px);transform:translate(-32px,.32em)}to{opacity:1;filter:blur(0);transform:translate(-32px,0)}}
@keyframes fact-rise{from{opacity:0;filter:blur(6px);transform:translateY(16px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes portal-caption{from{opacity:0;filter:blur(6px);transform:translateY(10px)}to{opacity:1;filter:blur(0);transform:translateY(0)}}
@keyframes menu-row{from{opacity:0;filter:blur(4px);transform:translateX(-12px)}to{opacity:1;filter:blur(0);transform:translateX(0)}}
@keyframes active-dot{from{transform:scale(0)}to{transform:scale(1)}}

@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
}
</style>
</head>

<script>
(() => {
  'use strict';

  const scenes = TEMPLATE.scenes;
  const DEFAULT_FOCUS = { x: 50, y: 50 };
  const STILL_HOLD_MS = 900; // how long an image-only arrival lingers before committing

  // ---- Elements -----------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const experience = document.querySelector('.experience');
  const planetList = document.querySelector('.planet-list');
  const backgroundsEl = document.querySelector('.backgrounds');
  const portalWrap = document.querySelector('.portal-wrap');
  const titleEl = $('planet-title');
  const factsEl = $('facts');
  const nextName = $('next-name');
  const nextNumber = $('next-number');
  const portal = $('portal');
  const portalVideo = $('portal-video');
  const portalImage = $('portal-image');
  const transitionVideo = $('transition-video');
  const portalCanvas = $('portal-canvas');
  const sceneCanvas = $('scene-canvas');
  const ctx = portalCanvas.getContext('2d');
  const sceneCtx = sceneCanvas.getContext('2d');
  const preloader = $('preloader');
  const preloaderVideo = $('preloader-video');
  const preloaderCount = $('preloader-count');
  const preloaderValue = $('preloader-value');
  const floatingLogo = $('floating-logo');
  const cursor = document.querySelector('.custom-cursor');

  // ---- State --------------------------------------------------------------
  let index = 0;
  let zoomProgress = 0;
  let transitionMedia = null;
  let transitionScene = null;
  let rendered = false;
  let busy = false;
  let expansion = 0;
  let maskScale = 0;
  let canvasOpacity = 1;
  let transitionActive = false;
  let hasFrozenScene = false;
  let rotX = 0, rotY = 0, targetX = 0, targetY = 0;

  // ---- Helpers ------------------------------------------------------------
  const ease = (t) => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  const nextFrame = () => new Promise((r) => requestAnimationFrame(r));

  function animateValue(setter, duration) {
    return new Promise((resolve) => {
      const start = performance.now();
      const step = (now) => {
        const t = Math.min(1, (now - start) / duration);
        setter(ease(t));
        if (t < 1) requestAnimationFrame(step);
        else resolve();
      };
      requestAnimationFrame(step);
    });
  }

  function retrigger(el, cls) {
    el.classList.remove(cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function once(target, events, timeout) {
    return new Promise((resolve) => {
      let timer;
      const done = (e) => {
        clearTimeout(timer);
        events.forEach((ev) => target.removeEventListener(ev, done));
        resolve(e ? e.type : 'timeout');
      };
      events.forEach((ev) => target.addEventListener(ev, done));
      if (timeout) timer = setTimeout(() => done(null), timeout);
    });
  }

  function mediaReady(media) {
    if (media instanceof HTMLImageElement) {
      if (media.complete && media.naturalWidth) return Promise.resolve();
      return once(media, ['load', 'error'], 4000);
    }
    if (media.readyState >= 2) return Promise.resolve();
    return once(media, ['loadeddata', 'canplay', 'error'], 4000);
  }

  function mediaSize(media) {
    return [media.videoWidth || media.naturalWidth || 0, media.videoHeight || media.naturalHeight || 0];
  }

  // ---- Render -------------------------------------------------------------
  function render() {
    const scene = scenes[index];
    const next = nextScene();
    experience.dataset.planet = scene.id;
    titleEl.textContent = scene.name.toUpperCase();
    nextName.textContent = next ? next.name : '';
    nextNumber.textContent = next ? next.label || '' : '';
    portal.setAttribute('aria-label', next ? `Travel to ${next.name}` : '');
    portalWrap.style.visibility = next ? '' : 'hidden';

    factsEl.innerHTML = (scene.facts || [])
      .map(([k, v]) => `<div class="fact"><dt>${k}</dt><dd>${v}</dd></div>`)
      .join('');

    planetList.innerHTML = TEMPLATE.menu
      .map((p) => `<span class="planet-item${p === scene.name ? ' active' : ''}">${p}</span>`)
      .join('');

    if (rendered) retrigger(planetList, 'is-switching');
    rendered = true;

    backgroundsEl.querySelectorAll('.background')
      .forEach((bg) => bg.classList.toggle('is-visible', bg.id === `${scene.id}-background`));

    if (!next) {
      portalVideo.pause();
    } else if (next.arrival) {
      if (portalVideo.src !== next.arrival) {
        portalVideo.src = next.arrival;
        portalVideo.load();
      }
      startPortalLoop();
    } else {
      portalVideo.pause();
      if (portalImage.src !== next.image) portalImage.src = next.image;
      portalImage.alt = next.name;
    }
  }

  function buildMedia() {
    floatingLogo.src = TEMPLATE.logo.src;
    floatingLogo.alt = TEMPLATE.logo.alt || '';
    const first = scenes[0];
    preloader.setAttribute('aria-label', `Loading ${first.name}`);
    const f0 = focusOf(first);
    preloaderVideo.style.objectPosition = `${f0.x}% ${f0.y}%`;
    if (first.arrival) preloaderVideo.src = first.arrival;
    scenes.forEach((scene) => {
      if (!scene.background) return;
      const v = document.createElement('video');
      v.id = `${scene.id}-background`;
      v.className = 'background';
      v.muted = true; v.playsInline = true; v.preload = 'auto';
      const f = focusOf(scene);
      v.style.objectPosition = `${f.x}% ${f.y}%`;
      v.src = scene.background;
      backgroundsEl.appendChild(v);
    });
  }

  // Draw a still into the held-scene canvas (used when a scene has no video).
  function freezeStill(src, scene) {
    const img = new Image();
    img.onload = () => {
      hasFrozenScene = false;
      resizeCanvas();
      sceneCtx.clearRect(0, 0, innerWidth, innerHeight);
      drawCover(img, sceneCtx, focusOf(scene), scene.zoom ?? 1);
      hasFrozenScene = true;
    };
    img.src = src;
  }

  function startPortalLoop() {
    portalVideo.loop = true;
    const p = portalVideo.play();
    if (p && p.catch) p.catch(() => {});
  }

  // ---- Canvas -------------------------------------------------------------
  function resizeCanvas() {
    const d = Math.min(window.devicePixelRatio || 1, 2);
    const w = innerWidth, h = innerHeight;
    portalCanvas.width = Math.round(w * d);
    portalCanvas.height = Math.round(h * d);
    portalCanvas.style.width = w + 'px';
    portalCanvas.style.height = h + 'px';
    ctx.setTransform(d, 0, 0, d, 0, 0);
    if (!hasFrozenScene) {
      sceneCanvas.width = Math.round(w * d);
      sceneCanvas.height = Math.round(h * d);
      sceneCanvas.style.width = w + 'px';
      sceneCanvas.style.height = h + 'px';
      sceneCtx.setTransform(d, 0, 0, d, 0, 0);
    }
  }

  // Cover-fit `media` to the viewport, cropping around `focus` (like CSS
  // object-position) and optionally zooming in while keeping `focus` fixed.
  function drawCover(media, c = ctx, focus = DEFAULT_FOCUS, zoom = 1) {
    const [mw, mh] = mediaSize(media);
    if (!mw || !mh) return;
    const fx = focus.x / 100, fy = focus.y / 100;
    const scale = Math.max(innerWidth / mw, innerHeight / mh);
    const w = mw * scale, h = mh * scale;
    const px = (innerWidth - w) * fx + w * fx;
    const py = (innerHeight - h) * fy + h * fy;
    const zw = w * zoom, zh = h * zoom;
    try { c.drawImage(media, px - zw * fx, py - zh * fy, zw, zh); } catch (e) { /* not decodable yet */ }
  }

  const sceneZoom = (scene) => 1 + ((scene.zoom ?? 1) - 1) * zoomProgress;
  const focusOf = (scene) => (scene && scene.focus) || DEFAULT_FOCUS;
  const nextScene = () => scenes[index + 1];
  const canTravel = () => { const n = nextScene(); return !!n && !n.locked && !!(n.arrival || n.image); };
  const previewMedia = (scene) => (scene.arrival ? portalVideo : portalImage);

  function drawShade(c = ctx) {
    const g = c.createLinearGradient(0, innerHeight * .52, 0, innerHeight);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,.88)');
    c.fillStyle = g;
    c.fillRect(0, innerHeight * .52, innerWidth, innerHeight * .48);
  }

  function roundedRectPoints(w, h, r) {
    r = Math.max(0, Math.min(r, w / 2, h / 2));
    const PI = Math.PI;
    const corners = [
      [w / 2 - r, -h / 2 + r, -PI / 2, 0],
      [w / 2 - r, h / 2 - r, 0, PI / 2],
      [-w / 2 + r, h / 2 - r, PI / 2, PI],
      [-w / 2 + r, -h / 2 + r, PI, PI * 1.5]
    ];
    const pts = [];
    for (const [ccx, ccy, a0, a1] of corners) {
      for (let i = 0; i <= 10; i++) {
        const a = a0 + (a1 - a0) * (i / 10);
        pts.push([ccx + Math.cos(a) * r, ccy + Math.sin(a) * r]);
      }
    }
    return pts;
  }

  function project([x, y], cx, cy, rx, ry) {
    const ax = rx * Math.PI / 180, ay = ry * Math.PI / 180;
    const xx = x * Math.cos(ay);
    const yy = y * Math.cos(ax);
    const z = x * Math.sin(ay) - y * Math.sin(ax);
    const p = 850 / (850 + z);
    return [cx + xx * p, cy + yy * p];
  }

  let lastTime = performance.now();
  function frame(now) {
    const dt = Math.min(40, now - lastTime);
    lastTime = now;
    const k = Math.min(1, dt * .009);
    rotX += (targetX - rotX) * k;
    rotY += (targetY - rotY) * k;

    ctx.clearRect(0, 0, innerWidth, innerHeight);
    if (hasFrozenScene) {
      ctx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
      drawShade();
    }

    const rect = portal.getBoundingClientRect();
    const e = expansion;
    const rcx = rect.left + rect.width / 2;
    const rcy = rect.top + rect.height / 2;
    const cx = rcx + (innerWidth / 2 - rcx) * e;
    const cy = rcy + (innerHeight / 2 - rcy) * e;
    const baseW = rect.width + (innerWidth - rect.width) * e;
    const baseH = rect.height + (innerHeight - rect.height) * e;
    const scale = e ? 1 : maskScale;
    const w = baseW * scale, h = baseH * scale;
    const r = 90 * (1 - e) * scale;
    const rx = rotX * (1 - e), ry = rotY * (1 - e);

    if (w > 1 && h > 1 && (transitionActive || nextScene())) {
      const pts = roundedRectPoints(w, h, r).map((pt) => project(pt, cx, cy, rx, ry));
      ctx.save();
      ctx.globalAlpha = canvasOpacity;
      ctx.beginPath();
      pts.forEach(([px, py], i) => (i ? ctx.lineTo(px, py) : ctx.moveTo(px, py)));
      ctx.closePath();
      ctx.clip();
      ctx.fillStyle = '#030303';
      ctx.fillRect(0, 0, innerWidth, innerHeight);
      if (transitionActive) {
        drawCover(transitionMedia, ctx, focusOf(transitionScene), sceneZoom(transitionScene));
      } else {
        const next = nextScene();
        drawCover(previewMedia(next), ctx, focusOf(next));
      }
      if (transitionActive) drawShade();
      ctx.restore();
    }

    updateCursor();
    requestAnimationFrame(frame);
  }

  // ---- Pointer tilt -------------------------------------------------------
  window.addEventListener('pointermove', (ev) => {
    pointer.x = ev.clientX;
    pointer.y = ev.clientY;
    if (!cursorShown) { cursorShown = true; orbit.x = pointer.x; orbit.y = pointer.y; cursor.classList.add('is-visible'); }
    if (busy) return;
    targetY = (ev.clientX / innerWidth - .5) * 37.4;
    targetX = (ev.clientY / innerHeight - .5) * -33;
  }, { passive: true });
  document.documentElement.addEventListener('pointerleave', () => { targetX = 0; targetY = 0; });

  // ---- Cursor -------------------------------------------------------------
  const pointer = { x: innerWidth / 2, y: innerHeight / 2 };
  const orbit = { x: pointer.x, y: pointer.y };
  let cursorShown = false;
  const cursorOrbit = cursor.querySelector('.cursor-orbit');
  const cursorDot = cursor.querySelector('.cursor-dot');
  const cursorLabel = cursor.querySelector('.cursor-label');

  function updateCursor() {
    orbit.x += (pointer.x - orbit.x) * .2;
    orbit.y += (pointer.y - orbit.y) * .2;
    cursor.style.transform = `translate3d(${orbit.x}px,${orbit.y}px,0)`;
    // Dot tracks the pointer precisely; orbit and label trail via the wrapper lerp.
    const dx = pointer.x - orbit.x, dy = pointer.y - orbit.y;
    cursorDot.style.left = dx + 'px';
    cursorDot.style.top = dy + 'px';
  }

  document.addEventListener('mouseleave', () => { cursor.classList.remove('is-visible'); cursorShown = false; });
  portal.addEventListener('pointerenter', () => cursor.classList.add('is-enter'));
  portal.addEventListener('pointerleave', () => cursor.classList.remove('is-enter'));

  // ---- Reveals ------------------------------------------------------------
  function revealMask() {
    retrigger(experience, 'mask-revealing');
    maskScale = 0;
    return animateValue((v) => { maskScale = v; }, 1050);
  }

  function revealPlanetContent() {
    retrigger(experience, 'content-revealing');
  }

  async function startExperience() {
    const next = nextScene();
    if (next) await mediaReady(previewMedia(next));
    await revealMask();
    document.body.classList.add('intro-ready');
    await wait(850);
    revealPlanetContent();
  }

  // ---- Travel -------------------------------------------------------------
  async function travel() {
    if (busy || !canTravel()) return;
    busy = true;
    targetX = 0; targetY = 0;
    const next = nextScene();
    const isVideo = !!next.arrival;
    try {
      if (isVideo) {
        transitionVideo.src = next.arrival;
        transitionVideo.load();
        experience.classList.add('is-loading');
        await once(transitionVideo, ['canplaythrough', 'error'], 1600);
      } else {
        await mediaReady(portalImage);
      }

      experience.classList.remove('is-loading', 'content-revealing', 'mask-revealing');
      experience.classList.add('is-transitioning');
      transitionMedia = isVideo ? transitionVideo : portalImage;
      transitionScene = next;
      zoomProgress = 0;
      canvasOpacity = 1;
      transitionActive = true;
      let ended = wait(STILL_HOLD_MS);
      if (isVideo) {
        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        ended = once(transitionVideo, ['ended', 'error']);
        await transitionVideo.play();
      }

      // The window swallows the screen while pushing into the focus point.
      await animateValue((v) => { expansion = v; zoomProgress = v; }, 1100);
      await ended;

      // Hold the final frame so the swap underneath is seamless.
      hasFrozenScene = false;
      resizeCanvas();
      sceneCtx.clearRect(0, 0, innerWidth, innerHeight);
      drawCover(transitionMedia, sceneCtx, focusOf(next), sceneZoom(next));
      hasFrozenScene = true;

      index += 1;
      experience.classList.add('is-committing');
      render();
      await nextFrame();
      await nextFrame();

      transitionActive = false;
      transitionMedia = null;
      zoomProgress = 0;
      expansion = 0;
      maskScale = 0;
      canvasOpacity = 1;
      experience.classList.remove('is-transitioning', 'is-committing');

      const maskReveal = revealMask();
      setTimeout(revealPlanetContent, 100);
      await maskReveal;

      await wait(450);
      transitionVideo.removeAttribute('src');
      transitionVideo.load();
      busy = false;
    } catch (err) {
      transitionActive = false;
      transitionMedia = null;
      zoomProgress = 0;
      expansion = 0;
      maskScale = 1;
      canvasOpacity = 1;
      experience.classList.remove('is-loading', 'is-transitioning', 'is-committing');
      busy = false;
    }
  }

  portal.addEventListener('click', travel);

  // ---- Preloader ----------------------------------------------------------
  let finished = false;
  let counting = false;

  function tickCount() {
    if (!counting) return;
    const d = preloaderVideo.duration;
    if (d && isFinite(d)) {
      preloaderValue.textContent = String(Math.min(100, Math.round(preloaderVideo.currentTime / d * 100)));
    }
    requestAnimationFrame(tickCount);
  }

  function finish() {
    if (finished) return;
    finished = true;
    counting = false;
    preloaderValue.textContent = '100';
    preloaderCount.classList.add('is-leaving');
    floatingLogo.classList.add('is-docked');
    preloader.classList.add('is-background');
    document.body.classList.add('preload-complete');
    startExperience();
    setTimeout(() => preloaderCount.remove(), 750);
    setTimeout(() => floatingLogo.classList.add('is-settled'), 2000);
  }

  function startPreloader() {
    const d = preloaderVideo.duration;
    preloaderVideo.playbackRate = Math.max(.25, (d && isFinite(d) ? d : 3) / 3);
    counting = true;
    requestAnimationFrame(tickCount);
    const p = preloaderVideo.play();
    if (p && p.catch) p.catch(finish);
  }

  // ---- Boot ---------------------------------------------------------------
  buildMedia();
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();
  render();

  if (scenes[0].arrival) {
    preloaderVideo.addEventListener('ended', finish);
    preloaderVideo.addEventListener('error', finish);
    if (preloaderVideo.readyState >= 1) startPreloader();
    else preloaderVideo.addEventListener('loadedmetadata', startPreloader, { once: true });
    // Safety net if the network never delivers metadata.
    setTimeout(() => { if (!finished && preloaderVideo.readyState < 1) finish(); }, 12000);
  } else {
    // No intro video: show the first scene's still and skip the countdown.
    if (scenes[0].image) freezeStill(scenes[0].image, scenes[0]);
    finish();
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
